name: Generate release assets

on:
  push:
    branches:
      - release/cventory-live
    paths:
      - .github/workflows/generate-release-assets.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release/cventory-live

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm og:generate
      - run: pnpm format

      - name: Commit generated release assets
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/og-cover.png src/components/Layout.tsx package.json scripts/generate-og.mjs
          git commit -m "style: finalize CVentory release assets"
          git push origin HEAD:release/cventory-live
