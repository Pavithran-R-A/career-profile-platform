name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Non-secret placeholders so `vite build` and the E2E preview render the
  # same safe error states locally as in CI. No live Supabase project is
  # contacted; live-RLS checks belong to an explicit integration workflow.
  VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-publishable-key
  # featureEnabled() defaults features OFF outside production.
  VITE_ENVIRONMENT: preview

jobs:
  quality:
    name: Format, Lint, Typecheck, Unit, Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level=high

      - name: Format check
        run: |
          pnpm exec prettier --write src/components/Brand.tsx src/pages/Privacy.tsx src/pages/RefundPolicy.tsx src/pages/Terms.tsx
          git diff -- src/components/Brand.tsx src/pages/Privacy.tsx src/pages/RefundPolicy.tsx src/pages/Terms.tsx
          exit 1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        # Bounded worker count keeps ordering-sensitive suites deterministic.
        run: pnpm test -- --maxWorkers=2

      - name: Build
        run: pnpm build

      - name: Bundle budget
        run: pnpm bundle:scan --budget

  e2e:
    name: E2E (Playwright, desktop + mobile)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (served by vite preview)
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e

      - name: Upload traces and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            e2e/.artifacts
            playwright-report
          retention-days: 7
