name = "cventory"
main = "./src/workers/worker.ts"
compatibility_date = "2026-09-20"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
# Public, non-secret runtime values. The publishable (anon) key is designed
# to be public — it ships inside the client bundle — and RLS enforces all
# authorization server-side. Supplying them as Worker vars lets server routes
# (recruiter ask profile lookup, SSR meta) reach the anon-readable view.
VITE_SUPABASE_URL = "https://yxrbytzhiilnzlamqpqz.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_MP5rlIreXdLslDRO52Vr2g_5cVnG076"
SUPABASE_URL = "https://yxrbytzhiilnzlamqpqz.supabase.co"

[previews.vars]
ENVIRONMENT = "preview"

[assets]
directory = "./dist/assets"
binding = "ASSETS"
not_found_handling = "single-page-application"
  run_worker_first = ["/api/*", "/", "/pricing", "/u/*", "/sitemap.xml", "/robots.txt"]

# Native Cloudflare Rate Limiting binding (Worker-side).
# Applied to recruiter AI / public API routes; not a product quota.
[[ratelimits]]
name = "RECRUITER_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
